name: Terraform

on:
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Validate secrets
        run: |
          test -n "${{ secrets.AWS_ACCOUNT_ID }}" || (echo "Missing AWS_ACCOUNT_ID" && exit 1)
          test -n "${{ secrets.AWS_ROLE_FOR_GITHUB_ACTIONS }}" || (echo "Missing AWS_ROLE_FOR_GITHUB_ACTIONS" && exit 1)

      - name: Checkout main
        uses: actions/checkout@v6

      - name: Load build.env
        run: cat build.env >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_FOR_GITHUB_ACTIONS }}"
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4

      - run: terraform init
      - run: terraform plan
      - run: terraform apply -auto-approve
